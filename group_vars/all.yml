---
# Entradas obrigatórias verificadas em todas as execuções.
# O único campo obrigatório é ip.
# host_name e host_aliases são opcionais.
# O Survey não poderá remover IPs presentes nesta lista.

windows_hosts_required:
  - ip: "10.10.10.10"
    host_name: "servidor-aplicacao.empresa.local"

  - ip: "10.10.10.20"
    host_name: "servidor-banco.empresa.local"
    host_aliases:
      - "servidor-banco"
      - "db01"

  - ip: "10.10.10.30"
    host_name: "servidor-monitoramento.empresa.local"

  # Exemplo válido com somente IP:
  # - ip: "10.10.10.40"
