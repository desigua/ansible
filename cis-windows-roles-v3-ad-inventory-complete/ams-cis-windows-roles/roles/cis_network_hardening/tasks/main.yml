---
- ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: RestrictReceivingNTLMTraffic
    data: 2
    type: dword
- ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0
    name: AuditReceivingNTLMTraffic
    data: 2
    type: dword
- ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: LmCompatibilityLevel
    data: "{{ ams_lm_compatibility_level }}"
    type: dword
- ansible.windows.win_regedit:
    path: HKLM:\Software\Microsoft\Windows NT\CurrentVersion\Winlogon
    name: CachedLogonsCount
    data: "{{ ams_cached_logons_count }}"
    type: string
- ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient
    name: EnableMulticast
    data: 0
    type: dword
  when: ams_disable_llmnr | bool
- ansible.windows.win_powershell:
    script: |
      $Adapters = Get-WmiObject Win32_NetworkAdapterConfiguration | Where-Object {$_.IPEnabled}
      foreach ($Adapter in $Adapters) { $null = $Adapter.SetTcpipNetbios(2) }
  when: ams_disable_netbios | bool
- ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: RestrictAnonymous
    data: 1
    type: dword
  when: ams_restrict_anonymous | bool
- ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: RestrictAnonymousSAM
    data: 1
    type: dword
  when: ams_restrict_anonymous | bool
- ansible.windows.win_powershell:
    script: |
      if (Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -ErrorAction SilentlyContinue) { Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart }
  when: ams_disable_smbv1 | bool
  failed_when: false
- ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
    name: SMB1
    data: 0
    type: dword
  when: ams_disable_smbv1 | bool
- ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters
    name: RequireSecuritySignature
    data: 1
    type: dword
  when: ams_enable_smb_signing | bool
- ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters
    name: RequireSecuritySignature
    data: 1
    type: dword
  when: ams_enable_smb_signing | bool

# LDAP Signing em DC está intencionalmente inibido neste pacote.
# Criar role separada para cis_domain_controller_baseline quando houver homologação.
# - ansible.windows.win_regedit:
#     path: HKLM:\SYSTEM\CurrentControlSet\Services\NTDS\Parameters
#     name: LDAPServerIntegrity
#     data: 2
#     type: dword
#   when:
#     - ams_allow_domain_controller_changes | bool
#     - ams_cis_profile == 'domain_controller'

- ansible.windows.win_regedit:
    path: "HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\{{ item.protocol }}\\{{ item.role }}"
    name: Enabled
    data: 0
    type: dword
  loop:
    - { protocol: 'TLS 1.0', role: 'Server' }
    - { protocol: 'TLS 1.0', role: 'Client' }
    - { protocol: 'TLS 1.1', role: 'Server' }
    - { protocol: 'TLS 1.1', role: 'Client' }
  when: ams_disable_legacy_tls | bool
- ansible.windows.win_regedit:
    path: "HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\{{ item.protocol }}\\{{ item.role }}"
    name: DisabledByDefault
    data: 1
    type: dword
  loop:
    - { protocol: 'TLS 1.0', role: 'Server' }
    - { protocol: 'TLS 1.0', role: 'Client' }
    - { protocol: 'TLS 1.1', role: 'Server' }
    - { protocol: 'TLS 1.1', role: 'Client' }
  when: ams_disable_legacy_tls | bool
