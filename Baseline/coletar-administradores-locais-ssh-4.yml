---
- name: Coletar administradores locais via SSH
  hosts: all
  gather_facts: false

  vars:
    administradores_permitidos:
      - mabreu
      - mabra
    caminho_relatorio: 'C:\Temp\adm.txt'

  tasks:
    - name: Criar pasta C:\Temp
      ansible.builtin.raw: |
        New-Item -Path 'C:\Temp' -ItemType Directory -Force | Out-Null
      changed_when: false

    - name: Gerar relatório de administradores locais
      ansible.builtin.raw: |
        $hostname = $env:COMPUTERNAME
        $permitidos = @('{{ administradores_permitidos | join("','") }}')
        $caminhoRelatorio = '{{ caminho_relatorio }}'
        $saida = [System.Collections.Generic.List[string]]::new()

        $saida.Add('=========================================')
        $saida.Add("Servidor: $hostname")
        $saida.Add("Data: $(Get-Date -Format 'dd/MM/yyyy HH:mm:ss')")
        $saida.Add('=========================================')
        $saida.Add('')
        $saida.Add('ADMINISTRADORES LOCAIS:')
        $saida.Add('')

        try {
            $admins = @(Get-LocalGroupMember -Group 'Administrators' -ErrorAction Stop | Sort-Object Name)
            $encontrados = [System.Collections.Generic.List[string]]::new()
            $extras = [System.Collections.Generic.List[string]]::new()

            foreach ($admin in $admins) {
                $saida.Add("$($admin.Name) [$($admin.ObjectClass)]")
                $usuario = $admin.Name.ToString().ToLowerInvariant().Trim()
                $encontrados.Add($usuario)
                $autorizado = $false

                foreach ($permitido in $permitidos) {
                    $permitidoNormalizado = $permitido.ToString().ToLowerInvariant().Trim()
                    $nomeSemDominio = ($usuario -split '\\')[-1]

                    if ($nomeSemDominio -eq $permitidoNormalizado) {
                        $autorizado = $true
                        break
                    }
                }

                if (-not $autorizado) {
                    $extras.Add($admin.Name.ToString())
                }
            }

            $faltando = [System.Collections.Generic.List[string]]::new()

            foreach ($permitido in $permitidos) {
                $permitidoNormalizado = $permitido.ToString().ToLowerInvariant().Trim()
                $existe = $false

                foreach ($usuario in $encontrados) {
                    $nomeSemDominio = ($usuario -split '\\')[-1]

                    if ($nomeSemDominio -eq $permitidoNormalizado) {
                        $existe = $true
                        break
                    }
                }

                if (-not $existe) {
                    $faltando.Add($permitido.ToString())
                }
            }

            $saida.Add('')
            $saida.Add('VALIDACAO:')
            $saida.Add('============')
            $saida.Add('')
            $saida.Add('ADMINISTRADORES PERMITIDOS:')

            foreach ($permitido in $permitidos) {
                $saida.Add(" - $permitido")
            }

            $saida.Add('')

            if ($faltando.Count -eq 0) {
                $saida.Add('CONTAS OBRIGATORIAS: OK')
            }
            else {
                $saida.Add('CONTAS FALTANDO:')
                foreach ($item in $faltando) {
                    $saida.Add(" - $item")
                }
            }

            $saida.Add('')

            if ($extras.Count -eq 0) {
                $saida.Add('ADMINISTRADORES EXTRAS: NENHUM')
            }
            else {
                $saida.Add('ADMINISTRADORES EXTRAS:')
                foreach ($item in $extras) {
                    $saida.Add(" - $item")
                }
            }

            $saida.Add('')

            if (($faltando.Count -eq 0) -and ($extras.Count -eq 0)) {
                $saida.Add('STATUS: COMPLIANT')
            }
            else {
                $saida.Add('STATUS: NON-COMPLIANT')
            }
        }
        catch {
            $saida.Add('')
            $saida.Add('ERRO AO CONSULTAR ADMINISTRADORES:')
            $saida.Add($_.Exception.Message)
            $saida.Add('')
            $saida.Add('STATUS: ERRO')
        }

        $saida | Set-Content -Path $caminhoRelatorio -Encoding UTF8 -Force
        $saida
      register: resultado
      changed_when: true

    - name: Exibir resultado no AWX
      ansible.builtin.debug:
        var: resultado.stdout_lines