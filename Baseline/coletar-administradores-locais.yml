---
- name: Auditoria de Administradores Locais
  hosts: all
  gather_facts: false

  vars:

    administradores_permitidos:
      - mabreu

  tasks:

    - name: Criar pasta C:\Temp
      ansible.windows.win_file:
        path: C:\Temp
        state: directory

    - name: Gerar relatório de compliance
      ansible.windows.win_shell: |

        $hostname = hostname

        $permitidos = @(
        {% for adm in administradores_permitidos %}
        "{{ adm | lower }}",
        {% endfor %}
        )

        $admins = Get-LocalGroupMember -Group "Administrators"

        $encontrados = @()
        $extras = @()

        foreach ($admin in $admins)
        {
            $usuario = $admin.Name.Split('\')[-1].ToLower()
            $encontrados += $usuario
        }

        $faltando = @()

        foreach ($permitido in $permitidos)
        {
            if ($permitido -notin $encontrados)
            {
                $faltando += $permitido
            }
        }

        foreach ($usuario in $encontrados)
        {
            if ($usuario -notin $permitidos)
            {
                $extras += $usuario
            }
        }

        $saida = @()

        $saida += "========================================="
        $saida += "Servidor: $hostname"
        $saida += "Data: $(Get-Date)"
        $saida += "========================================="
        $saida += ""

        $saida += "ADMINISTRADORES ENCONTRADOS"
        $saida += "---------------------------"

        foreach ($usuario in $encontrados)
        {
            $saida += $usuario
        }

        $saida += ""
        $saida += "ADMINISTRADORES PERMITIDOS"
        $saida += "--------------------------"

        foreach ($usuario in $permitidos)
        {
            $saida += $usuario
        }

        $saida += ""
        $saida += "CONTAS FALTANDO"
        $saida += "---------------"

        if ($faltando.Count -eq 0)
        {
            $saida += "Nenhuma"
        }
        else
        {
            foreach ($item in $faltando)
            {
                $saida += $item
            }
        }

        $saida += ""
        $saida += "CONTAS EXTRAS"
        $saida += "-------------"

        if ($extras.Count -eq 0)
        {
            $saida += "Nenhuma"
        }
        else
        {
            foreach ($item in $extras)
            {
                $saida += $item
            }
        }

        $saida += ""

        if (($faltando.Count -eq 0) -and ($extras.Count -eq 0))
        {
            $saida += "STATUS: COMPLIANT"
        }
        else
        {
            $saida += "STATUS: NON-COMPLIANT"
        }

        $saida | Out-File -FilePath C:\Temp\adm.txt -Encoding UTF8 -Force

        Get-Content C:\Temp\adm.txt

      register: resultado

    - name: Mostrar resultado
      debug:
        var: resultado.stdout_lines
`