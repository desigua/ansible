---
- name: Coletar administradores locais
  hosts: all
  gather_facts: false

  tasks:

    - name: Criar pasta C Temp
      ansible.windows.win_file:
        path: C:\Temp
        state: directory

    - name: Gerar relatorio
      ansible.windows.win_shell: |
        $hostname = hostname

        $admins = Get-LocalGroupMember -Group "Administrators" | Sort-Object Name

        $saida = @()

        $saida += "========================================="
        $saida += "Servidor: $hostname"
        $saida += "========================================="
        $saida += ""

        $permitidos = @("mabreu")

$encontrados = @()

foreach ($admin in $admins)
{
    $saida += "$($admin.Name) [$($admin.ObjectClass)]"

    $usuario = $admin.Name.Split('\')[-1].ToLower()
    $encontrados += $usuario
}

$extras = $encontrados | Where-Object { $_ -notin $permitidos }
$faltando = $permitidos | Where-Object { $_ -notin $encontrados }

$saida += ""
$saida += "VALIDACAO"
$saida += "=========="

if ($faltando.Count -eq 0)
{
    $saida += "CONTAS FALTANDO: NENHUMA"
}
else
{
    $saida += "CONTAS FALTANDO:"
    $faltando | ForEach-Object { $saida += " - $_" }
}

if ($extras.Count -eq 0)
{
    $saida += "CONTAS EXTRAS: NENHUMA"
}
else
{
    $saida += "CONTAS EXTRAS:"
    $extras | ForEach-Object { $saida += " - $_" }
}

        $saida | Out-File C:\Temp\adm.txt -Encoding UTF8 -Force

        Get-Content C:\Temp\adm.txt

      register: resultado

    - name: Mostrar resultado
      debug:
        var: resultado.stdout_lines