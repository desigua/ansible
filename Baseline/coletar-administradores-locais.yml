$hostname = hostname

$permitidos = @(
"mabreu"
)

$admins = Get-LocalGroupMember -Group "Administrators"

$encontrados = @()

foreach ($admin in $admins)
{
    $usuario = $admin.Name.Split('\')[-1].ToLower()
    $encontrados += $usuario
}

$faltando = @()
$extras = @()

foreach ($permitido in $permitidos)
{
    if ($permitido.ToLower() -notin $encontrados)
    {
        $faltando += $permitido
    }
}

foreach ($usuario in $encontrados)
{
    if ($usuario -notin $permitidos)
    {
        $extras += $usuario
    }
}

$saida = @()

$saida += "========================================="
$saida += "Servidor: $hostname"
$saida += "Data: $(Get-Date)"
$saida += "========================================="
$saida += ""

$saida += "ADMINISTRADORES ENCONTRADOS"
$saida += "---------------------------"

foreach ($usuario in $encontrados)
{
    $saida += $usuario
}

$saida += ""
$saida += "VALIDACAO"
$saida += "----------"

if ($faltando.Count -eq 0)
{
    $saida += "Conta obrigatoria encontrada: SIM"
}
else
{
    $saida += "Conta obrigatoria encontrada: NAO"
}

$saida += ""

$saida += "CONTAS FALTANDO"

if ($faltando.Count -eq 0)
{
    $saida += "Nenhuma"
}
else
{
    $faltando | ForEach-Object {
        $saida += $_
    }
}

$saida += ""

$saida += "CONTAS EXTRAS"

if ($extras.Count -eq 0)
{
    $saida += "Nenhuma"
}
else
{
    $extras | ForEach-Object {
        $saida += $_
    }
}

$saida += ""

if (($faltando.Count -eq 0) -and ($extras.Count -eq 0))
{
    $saida += "STATUS: COMPLIANT"
}
else
{
    $saida += "STATUS: NON-COMPLIANT"
}

$saida | Out-File C:\Temp\adm.txt -Encoding UTF8 -Force