---
- name: Coletar administradores locais
  hosts: all
  gather_facts: false

  tasks:

    - name: Criar pasta C:\Temp
      ansible.windows.win_file:
        path: C:\Temp
        state: directory

    - name: Gerar relatório de administradores locais
      ansible.windows.win_shell: |

        $hostname = hostname

        # Administradores permitidos
        $permitidos = "mabreu","mabra","administrator"

        $saida = @()

        $saida += "========================================="
        $saida += "Servidor: $hostname"
        $saida += "Data: $(Get-Date)"
        $saida += "========================================="
        $saida += ""
        $saida += "ADMINISTRADORES LOCAIS:"
        $saida += ""

        try {

            $admins = Get-LocalGroupMember -Group "Administrators" | Sort-Object Name

            $encontrados = @()
            $extras = @()

            foreach ($admin in $admins) {

                $saida += "$($admin.Name) [$($admin.ObjectClass)]"

                $usuario = $admin.Name
                $usuario = $usuario.Substring($usuario.LastIndexOf('\') + 1)
                $usuario = $usuario.ToLower()

                $encontrados += $usuario

                if ($usuario -notin $permitidos)
                {
                    $extras += $admin.Name
                }
            }

            $faltando = @()

            foreach ($permitido in $permitidos)
            {
                if ($permitido -notin $encontrados)
                {
                    $faltando += $permitido
                }
            }

            $saida += ""
            $saida += "VALIDACAO:"
            $saida += "============"
            $saida += ""

            $saida += "ADMINISTRADORES PERMITIDOS:"
            foreach ($permitido in $permitidos)
            {
                $saida += " - $permitido"
            }

            $saida += ""

            if ($faltando.Count -eq 0)
            {
                $saida += "CONTAS OBRIGATORIAS: OK"
            }
            else
            {
                $saida += "CONTAS FALTANDO:"

                foreach ($item in $faltando)
                {
                    $saida += " - $item"
                }
            }

            $saida += ""

            if ($extras.Count -eq 0)
            {
                $saida += "ADMINISTRADORES EXTRAS: NENHUM"
            }
            else
            {
                $saida += "ADMINISTRADORES EXTRAS:"

                foreach ($item in $extras)
                {
                    $saida += " - $item"
                }
            }

            $saida += ""

            if (($faltando.Count -eq 0) -and ($extras.Count -eq 0))
            {
                $saida += "STATUS: COMPLIANT"
            }
            else
            {
                $saida += "STATUS: NON-COMPLIANT"
            }

        }
        catch {

            $saida += ""
            $saida += "ERRO AO CONSULTAR ADMINISTRADORES:"
            $saida += $_.Exception.Message

        }

        $saida | Out-File -FilePath C:\Temp\adm.txt -Encoding UTF8 -Force

        Get-Content C:\Temp\adm.txt

      register: resultado

    - name: Exibir resultado no AWX
      debug:
        var: resultado.stdout_lines