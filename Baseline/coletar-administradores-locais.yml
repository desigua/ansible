---
- name: Auditoria de Administradores Locais
  hosts: all
  gather_facts: false

  vars:

    administradores_permitidos:
      - mabreu

  tasks:

    - name: Garantir C:\Temp
      ansible.windows.win_file:
        path: C:\Temp
        state: directory

    - name: Obter hostname
      ansible.windows.win_shell: hostname
      register: hostname

    - name: Obter administradores locais
      ansible.windows.win_shell: |
        Get-LocalGroupMember -Group Administrators |
        Select-Object -ExpandProperty Name
      register: admins

    - name: Gerar relatório de conformidade
      ansible.windows.win_shell: |

        $hostname = "{{ hostname.stdout }}"
        
        $esperados = @(
        {% for adm in administradores_permitidos %}
        "{{ adm }}",
        {% endfor %}
        )

        $encontrados = @(
        {% for adm in admins.stdout_lines %}
        "{{ adm }}",
        {% endfor %}
        )

        $faltando = $esperados | Where-Object { $_ -notin $encontrados }
        $extras    = $encontrados | Where-Object { $_ -notin $esperados }

        $saida = @()

        $saida += "========================================="
        $saida += "Servidor: $hostname"
        $saida += "Data: $(Get-Date)"
        $saida += "========================================="
        $saida += ""

        $saida += "ADMINISTRADORES ESPERADOS"
        $saida += "-------------------------"

        foreach ($item in $esperados)
        {
            $saida += $item
        }

        $saida += ""
        $saida += "ADMINISTRADORES ENCONTRADOS"
        $saida += "---------------------------"

        foreach ($item in $encontrados)
        {
            $saida += $item
        }

        $saida += ""
        $saida += "ADMINISTRADORES FALTANDO"
        $saida += "------------------------"

        if ($faltando.Count -eq 0)
        {
            $saida += "Nenhum"
        }
        else
        {
            $faltando | ForEach-Object { $saida += $_ }
        }

        $saida += ""
        $saida += "ADMINISTRADORES EXTRAS"
        $saida += "----------------------"

        if ($extras.Count -eq 0)
        {
            $saida += "Nenhum"
        }
        else
        {
            $extras | ForEach-Object { $saida += $_ }
        }

        $saida += ""

        if (($faltando.Count -eq 0) -and ($extras.Count -eq 0))
        {
            $saida += "STATUS: COMPLIANT"
        }
        else
        {
            $saida += "STATUS: NON-COMPLIANT"
        }

        $saida | Out-File C:\Temp\adm.txt -Encoding UTF8 -Force

      changed_when: false