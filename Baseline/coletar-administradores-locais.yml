---
- name: Diagnostico Windows
  hosts: windows
  gather_facts: false

  tasks:

    - name: Quem está executando
      ansible.windows.win_shell: whoami
      register: who

    - debug:
        var: who.stdout

    - name: Criar pasta
      ansible.windows.win_shell: |
        New-Item -Path C:\Temp -ItemType Directory -Force
        Test-Path C:\Temp
      register: pasta

    - debug:
        var: pasta.stdout_lines

    - name: Criar arquivo
      ansible.windows.win_shell: |
        "Servidor: $env:COMPUTERNAME" | Out-File C:\Temp\adm.txt -Encoding UTF8 -Force
        Test-Path C:\Temp\adm.txt
      register: arquivo

    - debug:
        var: arquivo.stdout_lines

    - name: Exibir conteúdo
      ansible.windows.win_shell: |
        Get-Content C:\Temp\adm.txt
      register: conteudo

    - debug:
        var: conteudo.stdout_lines