---
- name: Coletar administradores locais
  hosts: windows
  gather_facts: false

  tasks:

    - name: Garantir C:\Temp
      ansible.windows.win_file:
        path: C:\Temp
        state: directory

    - name: Coletar membros do grupo Administrators
      ansible.windows.win_shell: |
        $membros = Get-LocalGroupMember -Group "Administrators"

        $saida = @()

        foreach ($m in $membros)
        {
            $saida += "$($m.Name) ; $($m.ObjectClass)"
        }

        $saida | Out-File C:\Temp\adm.txt -Encoding UTF8

        $saida
      register: administradores

    - name: Mostrar administradores encontrados
      debug:
        var: administradores.stdout_lines