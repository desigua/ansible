---

- name: Update Linux System
  hosts: all
  tasks: 
    - name: YUM | Update System
      yum:
        name: "*"
        state: latest
        update_cache: yes
      when: ansible_distribution in ["CentOS", "RedHat"]
      become: yes

    - name: APT | Update Cache
      apt:
        update_cache: yes
      when: ansible_distribution in ["Debian", "Ubuntu"]
      become: yes

    - name: APT | Update System
      apt:
        name: "*"
        state: latest
      when: ansible_distribution in ["Debian", "Ubuntu"]
      become: yes

...

