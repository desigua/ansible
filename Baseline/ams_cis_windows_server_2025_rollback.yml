---
- name: AMS CIS Rollback - Windows Server 2019/2022/2025
  hosts: all
  gather_facts: false
  collections:
    - ansible.windows
    - community.windows

  vars:
    ams_rollback_administrator_to: "Administrator"

  pre_tasks:
    - name: Rollback Precheck | Coletar contexto do servidor Windows
      ansible.windows.win_powershell:
        script: |
          $cs = Get-CimInstance Win32_ComputerSystem
          $os = Get-CimInstance Win32_OperatingSystem
          $current = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          [PSCustomObject]@{
            ComputerName = $cs.Name
            Domain = $cs.Domain
            PartOfDomain = [bool]$cs.PartOfDomain
            Caption = $os.Caption
            Version = $os.Version
            BuildNumber = [int]$os.BuildNumber
            CurrentUser = $current
          } | ConvertTo-Json -Compress
      register: ams_precheck_raw
      changed_when: false
      tags: [always, precheck]

    - name: Rollback Precheck | Converter contexto em facts
      ansible.builtin.set_fact:
        ams_server_info: "{{ ams_precheck_raw.output[0] | from_json }}"
        is_domain_member: "{{ (ams_precheck_raw.output[0] | from_json).PartOfDomain | bool }}"
      tags: [always, precheck]

  tasks:
    ###########################################################################
    # ROLLBACK PASSWORD / LOCKOUT - STANDALONE ONLY
    ###########################################################################
    - name: Rollback Password Policy | Restaurar valores menos restritivos em standalone
      when: not is_domain_member
      tags: [password_policy, rollback]
      block:
        - community.windows.win_security_policy:
            section: System Access
            key: PasswordHistorySize
            value: 0
        - community.windows.win_security_policy:
            section: System Access
            key: MaximumPasswordAge
            value: 42
        - community.windows.win_security_policy:
            section: System Access
            key: MinimumPasswordLength
            value: 0
        - community.windows.win_security_policy:
            section: System Access
            key: PasswordComplexity
            value: 0

    - name: Rollback Account Lockout | Restaurar valores menos restritivos em standalone
      when: not is_domain_member
      tags: [account_lockout, rollback]
      block:
        - community.windows.win_security_policy:
            section: System Access
            key: LockoutBadCount
            value: 0
        - community.windows.win_security_policy:
            section: System Access
            key: LockoutDuration
            value: 0
        - community.windows.win_security_policy:
            section: System Access
            key: ResetLockoutCount
            value: 0

    ###########################################################################
    # ROLLBACK AUDIT POLICY
    ###########################################################################
    - name: Rollback Audit Policy | Desabilitar auditoria avancada das subcategorias gerenciadas
      ansible.windows.win_powershell:
        script: |
          auditpol /set /subcategory:"{{ item }}" /success:disable /failure:disable
      loop: "{{ ams_audit_subcategories }}"
      tags: [audit_policy, rollback]

    ###########################################################################
    # ROLLBACK POWERSHELL LOGGING
    ###########################################################################
    - name: Rollback PowerShell Logging | Desabilitar Module Logging
      ansible.windows.win_regedit:
        path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging'
        name: EnableModuleLogging
        data: 0
        type: dword
      tags: [powershell_logging, rollback]

    - name: Rollback PowerShell Logging | Desabilitar Script Block Logging
      ansible.windows.win_regedit:
        path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging'
        name: EnableScriptBlockLogging
        data: 0
        type: dword
      tags: [powershell_logging, rollback]

    - name: Rollback PowerShell Logging | Desabilitar Transcription
      ansible.windows.win_regedit:
        path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription'
        name: EnableTranscripting
        data: 0
        type: dword
      tags: [powershell_logging, rollback]

    ###########################################################################
    # ROLLBACK LEGACY PROTOCOLS - CONTROLADO POR VARIAVEL
    ###########################################################################
    - name: Rollback SMBv1 | Reabilitar SMBv1 apenas se explicitamente permitido
      when: ams_rollback_enable_legacy_protocols | bool
      ansible.windows.win_powershell:
        script: |
          if (Get-Command Set-SmbServerConfiguration -ErrorAction SilentlyContinue) {
            Set-SmbServerConfiguration -EnableSMB1Protocol $true -Force
          }
          $feature = Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -ErrorAction SilentlyContinue
          if ($feature -and $feature.State -eq 'Disabled') {
            Enable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart
          }
      tags: [smbv1, rollback]

    - name: Rollback LLMNR | Reabilitar LLMNR apenas se explicitamente permitido
      when: ams_rollback_enable_legacy_protocols | bool
      ansible.windows.win_regedit:
        path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
        name: EnableMulticast
        data: 1
        type: dword
      tags: [llmnr, rollback]

    - name: Rollback NetBIOS | Reabilitar NetBIOS por DHCP/default apenas se explicitamente permitido
      when: ams_rollback_enable_legacy_protocols | bool
      ansible.windows.win_powershell:
        script: |
          Get-CimInstance Win32_NetworkAdapterConfiguration | Where-Object { $_.IPEnabled } | ForEach-Object {
            Invoke-CimMethod -InputObject $_ -MethodName SetTcpipNetbios -Arguments @{ TcpipNetbiosOptions = 0 } | Out-Null
          }
      tags: [netbios, rollback]

    ###########################################################################
    # ROLLBACK NTLM / LSA / ANONYMOUS
    ###########################################################################
    - name: Rollback NTLM | Retornar LmCompatibilityLevel para compatibilidade padrao
      ansible.windows.win_regedit:
        path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
        name: LmCompatibilityLevel
        data: 3
        type: dword
      tags: [ntlm, rollback]

    - name: Rollback LSA | Permitir LM Hash novamente apenas se legado permitido
      when: ams_rollback_enable_legacy_protocols | bool
      ansible.windows.win_regedit:
        path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
        name: NoLMHash
        data: 0
        type: dword
      tags: [lsa, rollback]

    - name: Rollback Anonymous | Restaurar valores menos restritivos apenas se legado permitido
      when: ams_rollback_enable_legacy_protocols | bool
      ansible.windows.win_regedit:
        path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: dword
      loop:
        - { name: 'RestrictAnonymous', data: 0 }
        - { name: 'RestrictAnonymousSAM', data: 0 }
        - { name: 'EveryoneIncludesAnonymous', data: 1 }
      tags: [anonymous, rollback]

    ###########################################################################
    # ROLLBACK LOCAL ACCOUNTS
    ###########################################################################
    - name: Rollback Guest | Reabilitar Guest apenas se legado permitido
      when: ams_rollback_enable_legacy_protocols | bool
      ansible.windows.win_user:
        name: Guest
        account_disabled: false
      tags: [guest, rollback]

    - name: Rollback Administrator | Renomear RID-500 para nome de rollback
      ansible.windows.win_powershell:
        script: |
          $target = '{{ ams_rollback_administrator_to }}'
          $admin = Get-LocalUser | Where-Object { $_.SID.Value -match '-500$' }
          if ($null -ne $admin -and $admin.Name -ne $target) {
            $existing = Get-LocalUser -Name $target -ErrorAction SilentlyContinue
            if ($null -ne $existing -and $existing.SID.Value -ne $admin.SID.Value) {
              throw "Ja existe uma conta local chamada '$target' com SID diferente. Rollback abortado para evitar colisao."
            }
            Rename-LocalUser -Name $admin.Name -NewName $target
          }
      tags: [administrator, rollback]

    ###########################################################################
    # ROLLBACK CREDENTIAL GUARD
    ###########################################################################
    - name: Rollback Credential Guard | Desabilitar VBS/CG quando permitido
      when: ams_rollback_disable_credential_guard | bool
      ansible.windows.win_regedit:
        path: "{{ item.path }}"
        name: "{{ item.name }}"
        data: 0
        type: dword
      loop:
        - { path: 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard', name: 'EnableVirtualizationBasedSecurity' }
        - { path: 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard', name: 'RequirePlatformSecurityFeatures' }
        - { path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa', name: 'LsaCfgFlags' }
      tags: [credential_guard, rollback]

    ###########################################################################
    # ROLLBACK TLS
    ###########################################################################
    - name: Rollback TLS | Manter TLS 1.2/1.3 habilitados
      ansible.windows.win_regedit:
        path: "HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\{{ item.protocol }}\\{{ item.role }}"
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: dword
      loop:
        - { protocol: 'TLS 1.2', role: 'Server', name: 'Enabled', data: 1 }
        - { protocol: 'TLS 1.2', role: 'Server', name: 'DisabledByDefault', data: 0 }
        - { protocol: 'TLS 1.2', role: 'Client', name: 'Enabled', data: 1 }
        - { protocol: 'TLS 1.2', role: 'Client', name: 'DisabledByDefault', data: 0 }
        - { protocol: 'TLS 1.3', role: 'Server', name: 'Enabled', data: 1 }
        - { protocol: 'TLS 1.3', role: 'Server', name: 'DisabledByDefault', data: 0 }
        - { protocol: 'TLS 1.3', role: 'Client', name: 'Enabled', data: 1 }
        - { protocol: 'TLS 1.3', role: 'Client', name: 'DisabledByDefault', data: 0 }
      tags: [tls, rollback]

    - name: Rollback TLS legacy | Reabilitar SSL/TLS antigos apenas se explicitamente permitido
      when: ams_rollback_enable_legacy_protocols | bool
      ansible.windows.win_regedit:
        path: "HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\{{ item.protocol }}\\{{ item.role }}"
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: dword
      loop:
        - { protocol: 'TLS 1.0', role: 'Server', name: 'Enabled', data: 1 }
        - { protocol: 'TLS 1.0', role: 'Server', name: 'DisabledByDefault', data: 0 }
        - { protocol: 'TLS 1.0', role: 'Client', name: 'Enabled', data: 1 }
        - { protocol: 'TLS 1.0', role: 'Client', name: 'DisabledByDefault', data: 0 }
        - { protocol: 'TLS 1.1', role: 'Server', name: 'Enabled', data: 1 }
        - { protocol: 'TLS 1.1', role: 'Server', name: 'DisabledByDefault', data: 0 }
        - { protocol: 'TLS 1.1', role: 'Client', name: 'Enabled', data: 1 }
        - { protocol: 'TLS 1.1', role: 'Client', name: 'DisabledByDefault', data: 0 }
      tags: [tls, rollback]

    ###########################################################################
    # ROLLBACK EVENT LOGS, IPv6, SPOOLER
    ###########################################################################
    - name: Rollback Event Logs | Restaurar tamanhos padrao aproximados
      ansible.windows.win_powershell:
        script: |
          wevtutil sl Security /ms:20971520
          wevtutil sl Application /ms:20971520
          wevtutil sl System /ms:20971520
      tags: [eventlog, rollback]

    - name: Rollback IPv6 | Reabilitar IPv6 quando permitido
      when: ams_rollback_enable_ipv6 | bool
      ansible.windows.win_regedit:
        path: 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters'
        name: DisabledComponents
        data: 0
        type: dword
      tags: [ipv6, rollback]

    - name: Rollback Spooler | Reabilitar Spooler quando permitido
      when: ams_rollback_enable_spooler | bool
      ansible.windows.win_service:
        name: Spooler
        state: started
        start_mode: auto
      tags: [spooler, rollback]

  post_tasks:
    - name: Resumo Rollback
      ansible.builtin.debug:
        msg:
          - "Servidor: {{ inventory_hostname }}"
          - "SO: {{ ams_server_info.Caption }} build {{ ams_server_info.BuildNumber }}"
          - "Rollback executado. Legacy protocols reabilitados: {{ ams_rollback_enable_legacy_protocols }}"
          - "Credential Guard rollback: {{ ams_rollback_disable_credential_guard }}"
          - "Spooler reabilitado: {{ ams_rollback_enable_spooler }}"
          - "IPv6 reabilitado: {{ ams_rollback_enable_ipv6 }}"
      tags: [always]
