---
- name: Gerenciar arquivo hosts dos servidores Windows
  hosts: all
  gather_facts: false
  serial: "{{ execution_serial | default(20) }}"

  vars:
    hosts_file_path: 'C:\Windows\System32\drivers\etc\hosts'
    evidence_directory: 'C:\Temp\AWX'
    evidence_file: 'C:\Temp\AWX\hosts_ultima_execucao.txt'

    hosts_action: >-
      {{
        survey_hosts_action
        | default('validate')
        | string
        | trim
        | lower
      }}

    hosts_entries_text: >-
      {{
        survey_hosts_entries
        | default('')
        | string
      }}

    required_hosts_entries: >-
      {{
        windows_hosts_required
        | default([])
      }}

  pre_tasks:
    - name: Validar a ação informada pelo Survey
      ansible.builtin.assert:
        that:
          - hosts_action in ['validate', 'add', 'remove']
        fail_msg: >-
          A ação '{{ hosts_action }}' é inválida. Utilize validate, add ou remove.
        success_msg: >-
          Ação '{{ hosts_action }}' validada com sucesso.

    - name: Converter o conteúdo do Survey em uma lista de linhas
      ansible.builtin.set_fact:
        survey_lines: >-
          {{
            hosts_entries_text.splitlines()
            | map('trim')
            | reject('equalto', '')
            | reject('match', '^#')
            | list
          }}

    - name: Impedir entradas adicionais quando a ação for validate
      ansible.builtin.assert:
        that:
          - survey_lines | length == 0
        fail_msg: >-
          A ação validate não processa entradas adicionais. Deixe o campo de
          entradas vazio ou selecione add ou remove.
      when: hosts_action == 'validate'

    - name: Exigir pelo menos uma entrada para adicionar ou remover
      ansible.builtin.assert:
        that:
          - survey_lines | length > 0
        fail_msg: >-
          A ação '{{ hosts_action }}' exige pelo menos uma entrada. Informe uma
          entrada por linha nos formatos IP ou IP ALIAS1 ALIAS2.
      when: hosts_action in ['add', 'remove']

    - name: Validar o formato das entradas recebidas pelo Survey
      ansible.builtin.assert:
        that:
          - item.split() | length >= 1
          - item is match('^[0-9A-Fa-f:.]+([ \\t]+[^ \\t#]+)*$')
        fail_msg: >-
          Linha inválida: '{{ item }}'. Utilize IP ou IP ALIAS1 ALIAS2.
      loop: "{{ survey_lines }}"
      loop_control:
        label: "{{ item }}"
      when: survey_lines | length > 0

    - name: Inicializar a lista estruturada do Survey
      ansible.builtin.set_fact:
        survey_hosts_parsed: []

    - name: Converter as linhas do Survey em objetos estruturados
      ansible.builtin.set_fact:
        survey_hosts_parsed: >-
          {{
            survey_hosts_parsed
            +
            [
              {
                'ip': item.split()[0],
                'host_aliases': item.split()[1:],
                'host_line': item.split() | join(' ')
              }
            ]
          }}
      loop: "{{ survey_lines }}"
      loop_control:
        label: "{{ item }}"
      when: survey_lines | length > 0

    - name: Validar a estrutura das entradas da lista fixa
      ansible.builtin.assert:
        that:
          - item is mapping
          - item.ip is defined
          - item.ip | string | trim | length > 0
          - item.host_name is not defined or item.host_name | string | trim | length > 0
          - item.host_aliases is not defined or item.host_aliases is sequence
          - item.host_aliases is not defined or item.host_aliases is not string
        fail_msg: >-
          Entrada inválida na lista fixa: {{ item | to_nice_json }}. O campo ip
          é obrigatório. host_name é opcional. host_aliases é opcional e deve
          ser uma lista YAML.
        success_msg: >-
          Entrada fixa validada para o IP {{ item.ip }}.
      loop: "{{ required_hosts_entries }}"
      loop_control:
        label: "{{ item.ip | default('IP ausente') }}"
      when: required_hosts_entries | length > 0

    - name: Inicializar a lista estruturada de entradas fixas
      ansible.builtin.set_fact:
        required_hosts_parsed: []

    - name: Converter entradas fixas para linhas normalizadas
      ansible.builtin.set_fact:
        required_hosts_parsed: >-
          {{
            required_hosts_parsed
            +
            [
              {
                'ip': item.ip | string | trim,
                'host_line': (
                  [item.ip | string | trim]
                  + ([item.host_name | string | trim] if item.host_name is defined else [])
                  + (item.host_aliases | default([]) | list)
                ) | join(' ')
              }
            ]
          }}
      loop: "{{ required_hosts_entries }}"
      loop_control:
        label: "{{ item.ip }}"
      when: required_hosts_entries | length > 0

    - name: Inicializar a lista de IPs obrigatórios
      ansible.builtin.set_fact:
        required_host_ips: []

    - name: Montar a lista de IPs obrigatórios
      ansible.builtin.set_fact:
        required_host_ips: "{{ required_host_ips + [item.ip | lower] }}"
      loop: "{{ required_hosts_parsed }}"
      loop_control:
        label: "{{ item.ip }}"
      when: required_hosts_parsed | length > 0

    - name: Identificar IPs obrigatórios solicitados para remoção
      ansible.builtin.set_fact:
        protected_removal_ips: >-
          {{
            required_host_ips
            | intersect(survey_hosts_parsed | map(attribute='ip') | map('lower') | list)
            | list
          }}
      when: hosts_action == 'remove'

    - name: Bloquear a remoção das entradas da lista fixa
      ansible.builtin.assert:
        that:
          - protected_removal_ips | default([]) | length == 0
        fail_msg: >-
          Execução bloqueada. Os seguintes IPs pertencem à lista fixa e não
          podem ser removidos pelo Survey: {{ protected_removal_ips | join(', ') }}.
        success_msg: Nenhum IP obrigatório foi solicitado para remoção.
      when: hosts_action == 'remove'

  tasks:
    - name: Garantir que o arquivo hosts exista
      ansible.windows.win_file:
        path: "{{ hosts_file_path }}"
        state: touch
      changed_when: false

    - name: Garantir que as entradas da lista fixa estejam presentes
      community.windows.win_lineinfile:
        path: "{{ hosts_file_path }}"
        regexp: "^{{ item.ip | regex_escape }}(?:[ \\t]+.*)?$"
        line: "{{ item.host_line }}"
        state: present
        create: true
        backup: true
      loop: "{{ required_hosts_parsed }}"
      loop_control:
        label: "{{ item.host_line }}"
      register: required_entries_result
      when: required_hosts_parsed | length > 0

    - name: Informar que não existe lista fixa configurada
      ansible.builtin.debug:
        msg: >-
          Nenhuma entrada fixa foi configurada em windows_hosts_required.
          Somente as entradas recebidas pelo Survey serão processadas.
      when: required_hosts_parsed | length == 0

    - name: Adicionar ou atualizar entradas recebidas pelo Survey
      community.windows.win_lineinfile:
        path: "{{ hosts_file_path }}"
        regexp: "^{{ item.ip | regex_escape }}(?:[ \\t]+.*)?$"
        line: "{{ item.host_line }}"
        state: present
        create: true
        backup: true
      loop: "{{ survey_hosts_parsed }}"
      loop_control:
        label: "{{ item.host_line }}"
      register: added_entries_result
      when:
        - hosts_action == 'add'
        - survey_hosts_parsed | length > 0

    - name: Remover entradas recebidas pelo Survey pelo IP
      community.windows.win_lineinfile:
        path: "{{ hosts_file_path }}"
        regexp: "^{{ item.ip | regex_escape }}(?:[ \\t]+.*)?$"
        state: absent
        backup: true
      loop: "{{ survey_hosts_parsed }}"
      loop_control:
        label: "{{ item.ip }}"
      register: removed_entries_result
      when:
        - hosts_action == 'remove'
        - survey_hosts_parsed | length > 0

    - name: Confirmar novamente as entradas fixas após as alterações
      community.windows.win_lineinfile:
        path: "{{ hosts_file_path }}"
        regexp: "^{{ item.ip | regex_escape }}(?:[ \\t]+.*)?$"
        line: "{{ item.host_line }}"
        state: present
        create: true
        backup: true
      loop: "{{ required_hosts_parsed }}"
      loop_control:
        label: "{{ item.host_line }}"
      register: final_required_entries_result
      when: required_hosts_parsed | length > 0

    - name: Ler o conteúdo atualizado do arquivo hosts
      ansible.windows.win_shell: |
        $hostsPath = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
        if (-not (Test-Path -LiteralPath $hostsPath)) {
            throw "Arquivo hosts não encontrado: $hostsPath"
        }
        Get-Content -LiteralPath $hostsPath
      changed_when: false
      register: current_hosts_content

    - name: Criar o diretório de evidências
      ansible.windows.win_file:
        path: "{{ evidence_directory }}"
        state: directory

    - name: Gerar a evidência da execução
      ansible.windows.win_copy:
        dest: "{{ evidence_file }}"
        content: |
          ================================================================
          GERENCIAMENTO DO ARQUIVO HOSTS
          ================================================================

          Servidor: {{ inventory_hostname }}
          Ação solicitada: {{ hosts_action }}
          Entradas recebidas pelo Survey: {{ survey_hosts_parsed | length }}
          Entradas da lista fixa: {{ required_hosts_parsed | length }}
          Alias obrigatório: Não

          ================================================================
          ENTRADAS RECEBIDAS PELO SURVEY
          ================================================================
          {% if survey_hosts_parsed | length > 0 %}
          {% for entry in survey_hosts_parsed %}
          {{ entry.host_line }}
          {% endfor %}
          {% else %}
          Nenhuma entrada foi recebida pelo Survey.
          {% endif %}

          ================================================================
          LISTA FIXA CONFIGURADA
          ================================================================
          {% if required_hosts_parsed | length > 0 %}
          {% for entry in required_hosts_parsed %}
          {{ entry.host_line }}
          {% endfor %}
          {% else %}
          Nenhuma lista fixa foi configurada.
          {% endif %}

          ================================================================
          CONTEÚDO ATUAL DO ARQUIVO HOSTS
          ================================================================
          {{ current_hosts_content.stdout }}

    - name: Exibir o resumo da execução
      ansible.builtin.debug:
        msg:
          - "Servidor: {{ inventory_hostname }}"
          - "Ação executada: {{ hosts_action }}"
          - "Entradas recebidas pelo Survey: {{ survey_hosts_parsed | length }}"
          - "Entradas da lista fixa: {{ required_hosts_parsed | length }}"
          - "Arquivo gerenciado: {{ hosts_file_path }}"
          - "Evidência gerada em: {{ evidence_file }}"

    - name: Exibir o conteúdo atual do arquivo hosts
      ansible.builtin.debug:
        var: current_hosts_content.stdout_lines
