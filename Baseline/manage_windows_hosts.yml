---
- name: Gerenciar arquivo hosts dos servidores Windows
  hosts: all
  gather_facts: false
  serial: "{{ execution_serial | default(20) }}"

  vars:
    hosts_file_path: 'C:\Windows\System32\drivers\etc\hosts'
    evidence_directory: 'C:\Temp\AWX'
    evidence_file: 'C:\Temp\AWX\hosts_ultima_execucao.txt'

    # Variáveis fornecidas pelo Survey do AWX.
    hosts_action: >-
      {{
        survey_hosts_action
        | default('validate')
        | string
        | trim
        | lower
      }}

    hosts_entries_text: >-
      {{
        survey_hosts_entries
        | default('')
        | string
      }}

    # Se windows_hosts_required não estiver definida,
    # será considerada uma lista fixa vazia.
    required_hosts_entries: >-
      {{
        windows_hosts_required
        | default([])
      }}

  pre_tasks:

    - name: Validar a ação informada pelo Survey
      ansible.builtin.assert:
        that:
          - hosts_action in ['validate', 'add', 'remove']
        fail_msg: >-
          A ação '{{ hosts_action }}' é inválida.
          Utilize validate, add ou remove.
        success_msg: >-
          Ação '{{ hosts_action }}' validada com sucesso.

    - name: Converter o conteúdo do Survey em uma lista de linhas
      ansible.builtin.set_fact:
        survey_lines: >-
          {{
            hosts_entries_text.splitlines()
            | map('trim')
            | reject('equalto', '')
            | reject('match', '^#')
            | list
          }}

    - name: Impedir entradas adicionais quando a ação for validate
      ansible.builtin.assert:
        that:
          - survey_lines | length == 0
        fail_msg: >-
          A ação validate não processa entradas adicionais.
          Deixe o campo de entradas vazio ou selecione add ou remove.
      when: hosts_action == 'validate'

    - name: Exigir pelo menos uma entrada para adicionar ou remover
      ansible.builtin.assert:
        that:
          - survey_lines | length > 0
        fail_msg: >-
          A ação '{{ hosts_action }}' exige pelo menos uma entrada.
          Informe uma entrada por linha no formato:
          IP NOME_CANONICO
          ou:
          IP NOME_CANONICO ALIAS1 ALIAS2
      when: hosts_action in ['add', 'remove']

    - name: Validar o formato das entradas recebidas pelo Survey
      ansible.builtin.assert:
        that:
          - item.split() | length >= 2
          - item.split()[0] | length > 0
          - item.split()[1] | length > 0
          - item is match('^[0-9A-Fa-f:.]+[ \t]+[^ \t#]+([ \t]+[^ \t#]+)*$')
        fail_msg: >-
          Linha inválida: '{{ item }}'.
          Utilize um destes formatos:
          IP NOME_CANONICO
          IP NOME_CANONICO ALIAS1 ALIAS2
      loop: "{{ survey_lines }}"
      loop_control:
        label: "{{ item }}"
      when: survey_lines | length > 0

    - name: Inicializar a lista estruturada do Survey
      ansible.builtin.set_fact:
        survey_hosts_parsed: []

    - name: Converter as linhas do Survey em objetos estruturados
      ansible.builtin.set_fact:
        survey_hosts_parsed: >-
          {{
            survey_hosts_parsed
            +
            [
              {
                'ip': item.split()[0],
                'name': item.split()[1],
                'aliases': item.split()[2:]
              }
            ]
          }}
      loop: "{{ survey_lines }}"
      loop_control:
        label: "{{ item }}"
      when: survey_lines | length > 0

    - name: Validar a estrutura das entradas da lista fixa
      ansible.builtin.assert:
        that:
          - item is mapping
          - item.ip is defined
          - item.name is defined
          - item.ip | string | trim | length > 0
          - item.name | string | trim | length > 0
          - item.aliases is not defined or item.aliases is sequence
          - item.aliases is not defined or item.aliases is not string
        fail_msg: >-
          Entrada inválida na lista fixa:
          {{ item | to_nice_json }}.
          Os campos ip e name são obrigatórios.
          O campo aliases é opcional e, quando informado,
          deve ser declarado como uma lista YAML.
        success_msg: >-
          Entrada fixa validada:
          {{ item.ip }} {{ item.name }}.
      loop: "{{ required_hosts_entries }}"
      loop_control:
        label: >-
          {{
            item.ip | default('IP ausente')
          }}
          {{
            item.name | default('nome ausente')
          }}
      when: required_hosts_entries | length > 0

    - name: Inicializar a lista de nomes obrigatórios
      ansible.builtin.set_fact:
        required_canonical_names: []

    - name: Montar a lista de nomes canônicos obrigatórios
      ansible.builtin.set_fact:
        required_canonical_names: >-
          {{
            required_canonical_names
            +
            [item.name | string | trim | lower]
          }}
      loop: "{{ required_hosts_entries }}"
      loop_control:
        label: "{{ item.name }}"
      when: required_hosts_entries | length > 0

    - name: Inicializar a lista de nomes solicitados para remoção
      ansible.builtin.set_fact:
        requested_removal_names: []
      when: hosts_action == 'remove'

    - name: Montar a lista de nomes solicitados para remoção
      ansible.builtin.set_fact:
        requested_removal_names: >-
          {{
            requested_removal_names
            +
            [item.name | string | trim | lower]
          }}
      loop: "{{ survey_hosts_parsed }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - hosts_action == 'remove'
        - survey_hosts_parsed | length > 0

    - name: Identificar entradas obrigatórias solicitadas para remoção
      ansible.builtin.set_fact:
        protected_removal_names: >-
          {{
            required_canonical_names
            | intersect(requested_removal_names | default([]))
            | list
          }}
      when: hosts_action == 'remove'

    - name: Bloquear a remoção das entradas da lista fixa
      ansible.builtin.assert:
        that:
          - protected_removal_names | default([]) | length == 0
        fail_msg: >-
          Execução bloqueada. As seguintes entradas pertencem
          à lista fixa obrigatória e não podem ser removidas pelo Survey:
          {{
            protected_removal_names
            | default([])
            | join(', ')
          }}.
          Para remover uma entrada obrigatória, altere primeiro
          a variável windows_hosts_required no Git ou no AWX.
        success_msg: >-
          Nenhuma entrada obrigatória foi solicitada para remoção.
      when: hosts_action == 'remove'

  tasks:

    - name: Garantir que as entradas da lista fixa estejam presentes
      ansible.windows.win_hosts:
        state: present
        ip_address: "{{ item.ip }}"
        canonical_name: "{{ item.name }}"
        aliases: "{{ item.aliases | default(omit) }}"
        action: set
      loop: "{{ required_hosts_entries }}"
      loop_control:
        label: "{{ item.ip }} {{ item.name }}"
      register: required_entries_result
      when: required_hosts_entries | length > 0

    - name: Informar que não existe lista fixa configurada
      ansible.builtin.debug:
        msg: >-
          Nenhuma entrada fixa foi configurada na variável
          windows_hosts_required. Somente as entradas recebidas
          pelo Survey serão processadas.
      when: required_hosts_entries | length == 0

    - name: Adicionar ou atualizar entradas sem aliases
      ansible.windows.win_hosts:
        state: present
        ip_address: "{{ item.ip }}"
        canonical_name: "{{ item.name }}"
      loop: "{{ survey_hosts_parsed }}"
      loop_control:
        label: "{{ item.ip }} {{ item.name }}"
      register: added_entries_without_aliases
      when:
        - hosts_action == 'add'
        - survey_hosts_parsed | length > 0
        - item.aliases | default([]) | length == 0

    - name: Adicionar ou atualizar entradas com aliases
      ansible.windows.win_hosts:
        state: present
        ip_address: "{{ item.ip }}"
        canonical_name: "{{ item.name }}"
        aliases: "{{ item.aliases }}"
        action: set
      loop: "{{ survey_hosts_parsed }}"
      loop_control:
        label: >-
          {{ item.ip }}
          {{ item.name }}
          {{ item.aliases | default([]) | join(' ') }}
      register: added_entries_with_aliases
      when:
        - hosts_action == 'add'
        - survey_hosts_parsed | length > 0
        - item.aliases | default([]) | length > 0

    - name: Remover as entradas recebidas pelo Survey
      ansible.windows.win_hosts:
        state: absent
        ip_address: "{{ item.ip }}"
        canonical_name: "{{ item.name }}"
      loop: "{{ survey_hosts_parsed }}"
      loop_control:
        label: "{{ item.ip }} {{ item.name }}"
      register: removed_entries_result
      when:
        - hosts_action == 'remove'
        - survey_hosts_parsed | length > 0

    - name: Confirmar novamente as entradas fixas com aliases
      ansible.windows.win_hosts:
        state: present
        ip_address: "{{ item.ip }}"
        canonical_name: "{{ item.name }}"
        aliases: "{{ item.aliases }}"
        action: set
      loop: "{{ required_hosts_entries }}"
      loop_control:
        label: "{{ item.ip }} {{ item.name }}"
      register: final_required_with_aliases
      when:
        - required_hosts_entries | length > 0
        - item.aliases is defined
        - item.aliases | length > 0

    - name: Confirmar novamente as entradas fixas sem aliases
      ansible.windows.win_hosts:
        state: present
        ip_address: "{{ item.ip }}"
        canonical_name: "{{ item.name }}"
      loop: "{{ required_hosts_entries }}"
      loop_control:
        label: "{{ item.ip }} {{ item.name }}"
      register: final_required_without_aliases
      when:
        - required_hosts_entries | length > 0
        - item.aliases is not defined or item.aliases | length == 0

    - name: Ler o conteúdo atualizado do arquivo hosts
      ansible.windows.win_shell: |
        $hostsPath = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'

        if (-not (Test-Path -LiteralPath $hostsPath)) {
            throw "Arquivo hosts não encontrado: $hostsPath"
        }

        Get-Content -LiteralPath $hostsPath
      changed_when: false
      register: current_hosts_content

    - name: Criar o diretório de evidências
      ansible.windows.win_file:
        path: "{{ evidence_directory }}"
        state: directory

    - name: Gerar a evidência da execução
      ansible.windows.win_copy:
        dest: "{{ evidence_file }}"
        content: |
          ================================================================
          GERENCIAMENTO DO ARQUIVO HOSTS
          ================================================================

          Servidor: {{ inventory_hostname }}
          Ação solicitada: {{ hosts_action }}
          Entradas recebidas pelo Survey: {{ survey_hosts_parsed | length }}
          Entradas da lista fixa: {{ required_hosts_entries | length }}
          Alias obrigatório: Não

          ================================================================
          RESULTADO DA EXECUÇÃO
          ================================================================

          {% if hosts_action == 'validate' %}
          A lista fixa foi validada.
          As entradas fixas ausentes foram incluídas.
          As entradas fixas existentes foram mantidas ou corrigidas.
          {% elif hosts_action == 'add' %}
          A lista fixa foi validada.
          As entradas recebidas pelo Survey foram adicionadas ou atualizadas.
          {% elif hosts_action == 'remove' %}
          As entradas não protegidas recebidas pelo Survey foram removidas.
          A lista fixa foi validada novamente após a remoção.
          {% endif %}

          ================================================================
          ENTRADAS RECEBIDAS PELO SURVEY
          ================================================================

          {% if survey_hosts_parsed | length > 0 %}
          {% for entry in survey_hosts_parsed %}
          {{ entry.ip }} {{ entry.name }}{% if entry.aliases | default([]) | length > 0 %} {{ entry.aliases | join(' ') }}{% endif %}
          {% endfor %}
          {% else %}
          Nenhuma entrada foi recebida pelo Survey.
          {% endif %}

          ================================================================
          LISTA FIXA CONFIGURADA
          ================================================================

          {% if required_hosts_entries | length > 0 %}
          {% for entry in required_hosts_entries %}
          {{ entry.ip }} {{ entry.name }}{% if entry.aliases | default([]) | length > 0 %} {{ entry.aliases | join(' ') }}{% endif %}
          {% endfor %}
          {% else %}
          Nenhuma lista fixa foi configurada.
          {% endif %}

          ================================================================
          CONTEÚDO ATUAL DO ARQUIVO HOSTS
          ================================================================

          {{ current_hosts_content.stdout }}

    - name: Exibir o resumo da execução
      ansible.builtin.debug:
        msg:
          - "Servidor: {{ inventory_hostname }}"
          - "Ação executada: {{ hosts_action }}"
          - "Entradas recebidas pelo Survey: {{ survey_hosts_parsed | length }}"
          - "Entradas da lista fixa: {{ required_hosts_entries | length }}"
          - "Arquivo gerenciado: {{ hosts_file_path }}"
          - "Evidência gerada em: {{ evidence_file }}"

    - name: Exibir o conteúdo atual do arquivo hosts
      ansible.builtin.debug:
        var: current_hosts_content.stdout_lines