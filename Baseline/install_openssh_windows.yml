---
- name: Instalar e configurar OpenSSH Server
  hosts: all
  gather_facts: false

  vars:
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985

  tasks:

    - name: Verificar estado do OpenSSH
      ansible.windows.win_shell: |
        try {
            (Get-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0).State
        }
        catch {
            "NOT_FOUND"
        }
      register: openssh_state
      changed_when: false

    - name: Exibir estado atual
      debug:
        msg: "Estado OpenSSH: {{ openssh_state.stdout }}"

    - name: Instalar OpenSSH Server
      ansible.windows.win_shell: |
        try {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
            Write-Output "INSTALLED"
        }
        catch {
            Write-Output $_.Exception.Message
            exit 1
        }
      when: "'Installed' not in openssh_state.stdout"

    - name: Garantir serviço sshd
      ansible.windows.win_service:
        name: sshd
        state: started
        start_mode: auto

    - name: Garantir ssh-agent
      ansible.windows.win_service:
        name: ssh-agent
        start_mode: auto
      ignore_errors: true

    - name: Configurar PowerShell como shell padrão
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\OpenSSH
        name: DefaultShell
        data: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        type: string

    - name: Configurar Firewall
      community.windows.win_firewall_rule:
        name: OpenSSH-Server-In-TCP
        display_name: OpenSSH Server (sshd)
        direction: in
        action: allow
        protocol: tcp
        localport: 22
        enabled: true
        state: present

    - name: Reiniciar serviço sshd
      ansible.windows.win_service:
        name: sshd
        state: restarted

    - name: Validar serviço sshd
      ansible.windows.win_service_info:
        name: sshd
      register: sshd_info

    - name: Status do SSHD
      debug:
        msg: "{{ sshd_info.services[0].state }}"

    - name: Aguardar porta 22 ficar disponível
      ansible.windows.win_shell: |
        $contador = 0

        do {
            Start-Sleep -Seconds 2
            $resultado = Test-NetConnection localhost -Port 22 -WarningAction SilentlyContinue
            $contador++
        }
        while (($resultado.TcpTestSucceeded -ne $true) -and ($contador -lt 30))

        if ($resultado.TcpTestSucceeded) {
            Write-Output "READY"
        }
        else {
            throw "SSH NOT LISTENING"
        }
      register: port22_check

    - name: Resultado da validação
      debug:
        var: port22_check.stdout

    - name: Testar processo sshd
      ansible.windows.win_shell: |
        Get-Process sshd -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id
      register: sshd_pid
      changed_when: false

    - name: Exibir PID do SSHD
      debug:
        var: sshd_pid.stdout