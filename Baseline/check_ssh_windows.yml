---
# ============================================================================
# Playbook: check_ssh_windows.yml
# Objetivo:
#   Play 1 (via WinRM) - Garantir que o OpenSSH Server está instalado,
#            habilitado e com a regra de firewall correta no Windows Server.
#   Play 2 (via SSH)   - Validar conectividade, autenticação e execução de
#            comandos via SSH, agora que o serviço está disponível.
#
# IMPORTANTE:
#   A instalação do SSH precisa ser feita via WinRM, porque o host ainda não
#   tem SSH disponível nesse ponto (não é possível instalar SSH usando SSH
#   em um servidor que ainda não o possui). Por isso o playbook usa dois
#   grupos de inventário diferentes: [windows_winrm] para a instalação e
#   [windows_ssh] para a validação (normalmente os mesmos hosts).
#
# Uso:
#   ansible-playbook -i inventory_windows_ssh.ini check_ssh_windows.yml
# ============================================================================

- name: Instalar e habilitar OpenSSH Server no Windows (via WinRM)
  hosts: all
  gather_facts: no
  vars:
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5985
    # ansible_user: administrator
    # ansible_password: "{{ vault_windows_password }}"

  tasks:

    - name: 1. Verificar se a capability OpenSSH.Server já está instalada
      ansible.windows.win_shell: |
        (Get-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0).State
      register: ssh_capability_state
      changed_when: false

    - name: 2. Instalar OpenSSH Server (caso ainda não esteja instalado)
      ansible.windows.win_shell: |
        Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
      when: "'Installed' not in ssh_capability_state.stdout"
      register: ssh_install_result

    - name: 3. Iniciar o serviço sshd e configurar start automático
      ansible.windows.win_service:
        name: sshd
        state: started
        start_mode: auto

    - name: 4. Garantir que o serviço ssh-agent também inicie automaticamente
      ansible.windows.win_service:
        name: ssh-agent
        start_mode: auto

    - name: 5. Definir PowerShell como shell padrão do OpenSSH (recomendado)
      ansible.windows.win_shell: |
        New-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name DefaultShell `
          -Value "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -PropertyType String -Force
      changed_when: true

    - name: 6. Criar/garantir regra de firewall para a porta 22 (SSH)
      community.windows.win_firewall_rule:
        name: OpenSSH-Server-In-TCP
        display_name: "OpenSSH Server (sshd)"
        direction: in
        action: allow
        protocol: tcp
        localport: 22
        enabled: yes
        state: present

    - name: 7. Confirmar estado final do serviço sshd
      ansible.windows.win_service_info:
        name: sshd
      register: sshd_info

    - name: Exibir status do serviço sshd
      ansible.builtin.debug:
        msg: "sshd no host {{ inventory_hostname }}: {{ sshd_info.services[0].state }}"


- name: Verificar conectividade e autenticação SSH em Windows Server
  hosts: all
  gather_facts: no
  vars:
    ansible_connection: ssh
    ansible_shell_type: powershell
    # Descomente e ajuste conforme o método de autenticação usado:
    # ansible_user: administrator
    # ansible_password: "{{ vault_windows_password }}"
    # ansible_ssh_private_key_file: ~/.ssh/id_rsa_windows
    # ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

  tasks:

    - name: 1. Testar conectividade de rede na porta SSH (22)
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: 22
        timeout: 10
        state: started
      delegate_to: localhost
      register: port_check
      ignore_errors: yes

    - name: Reportar falha de conectividade de rede (porta 22 inacessível)
      ansible.builtin.fail:
        msg: >
          Não foi possível alcançar {{ inventory_hostname }} na porta 22.
          Verifique firewall, rota de rede e se o serviço sshd está ativo.
      when: port_check is failed

    - name: 2. Testar autenticação e execução remota (comando simples)
      ansible.builtin.raw: whoami
      register: whoami_result
      changed_when: false

    - name: Exibir usuário autenticado no host remoto
      ansible.builtin.debug:
        msg: "Autenticado como: {{ whoami_result.stdout | trim }}"

    - name: 3. Testar execução de módulo Ansible via PowerShell (setup)
      ansible.builtin.setup:
        filter: "ansible_hostname,ansible_distribution*,ansible_os_family"
      register: facts_result

    - name: Exibir informações do sistema coletadas
      ansible.builtin.debug:
        msg:
          - "Hostname: {{ facts_result.ansible_facts.ansible_hostname | default('N/D') }}"
          - "Sistema: {{ facts_result.ansible_facts.ansible_distribution | default('N/D') }} {{ facts_result.ansible_facts.ansible_distribution_version | default('') }}"
          - "Família OS: {{ facts_result.ansible_facts.ansible_os_family | default('N/D') }}"

    - name: 4. Validar versão do PowerShell no host remoto
      ansible.builtin.raw: $PSVersionTable.PSVersion.ToString()
      register: ps_version
      changed_when: false

    - name: Exibir versão do PowerShell
      ansible.builtin.debug:
        msg: "PowerShell version: {{ ps_version.stdout | trim }}"

    - name: 5. Consolidar resultado do teste
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} — Conectividade SSH e autenticação OK"
