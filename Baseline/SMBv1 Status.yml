---
- name: Verificar SMBv1 e gerar arquivo de status
  hosts: windows
  gather_facts: no

  tasks:
    - name: Executar comando para verificar SMBv1
      ansible.windows.win_shell: |
        Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol
      register: smb_status

    - name: Interpretar status do SMBv1
      ansible.builtin.set_fact:
        smb_msg: >
          {% if 'Enabled' in smb_status.stdout %}
            SMBv1 está HABILITADO.
          {% elif 'Disabled' in smb_status.stdout %}
            SMBv1 está DESABILITADO.
          {% elif 'NotPresent' in smb_status.stdout %}
            SMBv1 não está presente no sistema.
          {% else %}
            Não foi possível determinar o estado do SMBv1.
          {% endif %}

    - name: Criar diretório C:\temp se não existir
      ansible.windows.win_file:
        path: C:\temp
        state: directory

    - name: Gravar status no arquivo TXT
      ansible.windows.win_copy:
        content: "{{ smb_msg }}"
        dest: C:\temp\status-smbv1.txt
