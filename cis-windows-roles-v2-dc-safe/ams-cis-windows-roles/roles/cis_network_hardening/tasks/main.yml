---
- name: Restrict NTLM Receiving Traffic
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: RestrictReceivingNTLMTraffic
    data: 2
    type: dword

- name: Audit NTLM Receiving Traffic
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0
    name: AuditReceivingNTLMTraffic
    data: 2
    type: dword

- name: LAN Manager Authentication Level - NTLMv2 only
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: LmCompatibilityLevel
    data: "{{ ams_lm_compatibility_level }}"
    type: dword

- name: Limitar Cached Logons
  ansible.windows.win_regedit:
    path: HKLM:\Software\Microsoft\Windows NT\CurrentVersion\Winlogon
    name: CachedLogonsCount
    data: "{{ ams_cached_logons_count }}"
    type: string

- name: Desabilitar LLMNR
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient
    name: EnableMulticast
    data: 0
    type: dword
  when: ams_disable_llmnr | bool

- name: Desabilitar NetBIOS em interfaces IP habilitadas
  ansible.windows.win_powershell:
    script: |
      $Adapters = Get-WmiObject Win32_NetworkAdapterConfiguration | Where-Object {$_.IPEnabled}
      foreach ($Adapter in $Adapters) { $null = $Adapter.SetTcpipNetbios(2) }
  when: ams_disable_netbios | bool

- name: Bloquear enumeração anônima
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: RestrictAnonymous
    data: 1
    type: dword
  when: ams_restrict_anonymous | bool

- name: Bloquear enumeração anônima SAM/SID
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: RestrictAnonymousSAM
    data: 1
    type: dword
  when: ams_restrict_anonymous | bool

- name: Desabilitar SMBv1 Optional Feature
  ansible.windows.win_powershell:
    script: |
      if (Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -ErrorAction SilentlyContinue) {
        Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart
      }
  when: ams_disable_smbv1 | bool
  register: smbv1_disable
  failed_when: false

- name: Desabilitar SMBv1 no LanmanServer
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
    name: SMB1
    data: 0
    type: dword
  when: ams_disable_smbv1 | bool

- name: Exigir SMB Signing Client
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters
    name: RequireSecuritySignature
    data: 1
    type: dword
  when: ams_enable_smb_signing | bool

- name: Exigir SMB Signing Server
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters
    name: RequireSecuritySignature
    data: 1
    type: dword
  when: ams_enable_smb_signing | bool

# ATENÇÃO:
# LDAP Signing em Domain Controllers está intencionalmente inibido neste pacote.
# Motivo: Domain Controllers exigem baseline específica, homologação e janela controlada.
# Quando for aprovado, criar role separada para cis_domain_controller_baseline.
#
# - name: LDAP Signing Required somente em Domain Controller
