---
- name: AMS CIS L1 Core - Windows Server Modular DC Safe
  hosts: all
  gather_facts: false

  collections:
    - ansible.windows
    - community.windows

  tasks:
    ############################################################
    # 1. DETECT CONTEXT - READ ONLY
    ############################################################
    - name: Detectar contexto do servidor Windows
      ansible.builtin.include_role:
        name: cis_detect_context
      tags:
        - always
        - detect_context

    ############################################################
    # 2. DOMAIN CONTROLLER PROTECTION
    # Neste momento, Domain Controllers ficam protegidos contra
    # qualquer alteração feita por este playbook.
    ############################################################
    - name: Informar que Domain Controller será ignorado por segurança
      ansible.builtin.debug:
        msg:
          - "Servidor: {{ inventory_hostname }}"
          - "CIS Profile: {{ ams_cis_profile }}"
          - "Ação: nenhuma alteração será aplicada porque este host é Domain Controller."
          - "Motivo: ams_skip_domain_controllers está habilitado."
          - "Para DCs, criar baseline específica separada e homologada."
      when:
        - ams_skip_domain_controllers | bool
        - ams_cis_profile == 'domain_controller'
      tags:
        - always
        - dc_protection

    - name: Encerrar execução neste host quando for Domain Controller
      ansible.builtin.meta: end_host
      when:
        - ams_skip_domain_controllers | bool
        - ams_cis_profile == 'domain_controller'
      tags:
        - always
        - dc_protection

    ############################################################
    # 3. BASELINE PARA STANDALONE E MEMBER SERVER
    ############################################################
    - name: Preparar evidências e backup inicial
      ansible.builtin.include_role:
        name: cis_evidence
      tags: [always, evidence, backup]

    - name: Aplicar Password Policy e Account Lockout
      ansible.builtin.include_role:
        name: cis_password_lockout
      tags: [password_policy, account_lockout, cis_l1]

    - name: Aplicar Audit Policy
      ansible.builtin.include_role:
        name: cis_audit_policy
      tags: [audit_policy, cis_l1]

    - name: Aplicar Firewall, Defender e ASR
      ansible.builtin.include_role:
        name: cis_firewall_defender
      tags: [firewall, defender, asr, cis_l1]

    - name: Aplicar PowerShell Logging
      ansible.builtin.include_role:
        name: cis_powershell_logging
      tags: [powershell_logging, cis_l1]

    - name: Aplicar Network Hardening
      ansible.builtin.include_role:
        name: cis_network_hardening
      tags: [ntlm, llmnr, netbios, smb, ldap, tls, cis_l1]

    - name: Aplicar System Hardening
      ansible.builtin.include_role:
        name: cis_system_hardening
      tags: [guest, remote_registry, autorun, uac, credential_guard, eventlog, cis_l1]

    - name: Aplicar Remote Access Hardening
      ansible.builtin.include_role:
        name: cis_remote_access
      tags: [rdp, winrm, cis_l1]

    - name: Executar validações e exportar evidências
      ansible.builtin.include_role:
        name: cis_compliance_validation
      tags: [validation, compliance, evidence]

    - name: Resumo CIS modular
      ansible.builtin.debug:
        msg:
          - "Servidor: {{ inventory_hostname }}"
          - "CIS Profile: {{ ams_cis_profile | default('unknown') }}"
          - "Domain Member: {{ is_domain_member | default('unknown') }}"
          - "Domain Controller: {{ is_domain_controller | default('unknown') }}"
          - "Password Policy aplicada: {{ ams_cis_profile == 'standalone' }}"
          - "Lockout Policy aplicada: {{ ams_cis_profile == 'standalone' }}"
          - "Baseline CIS processada para: {{ ams_cis_profile }}"
          - "Evidências em: {{ ams_evidence_path }}"
          - "Backup em: {{ ams_backup_path }}"
      tags: [always, summary]
