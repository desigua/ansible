---
- name: Desabilitar conta Guest
  ansible.windows.win_user:
    name: Guest
    account_disabled: true
  when: ams_disable_guest_account | bool

- name: Desabilitar Remote Registry
  ansible.windows.win_service:
    name: RemoteRegistry
    start_mode: disabled
    state: stopped
  when: ams_disable_remote_registry | bool

- name: Desabilitar Autorun
  ansible.windows.win_regedit:
    path: HKLM:\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer
    name: NoDriveTypeAutoRun
    data: 255
    type: dword
  when: ams_disable_autorun | bool

- name: UAC - EnableLUA
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: EnableLUA
    data: 1
    type: dword
  when: ams_enable_uac_hardening | bool

- name: UAC - PromptOnSecureDesktop
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: PromptOnSecureDesktop
    data: 1
    type: dword
  when: ams_enable_uac_hardening | bool

- name: UAC - ConsentPromptBehaviorAdmin
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: ConsentPromptBehaviorAdmin
    data: 2
    type: dword
  when: ams_enable_uac_hardening | bool

- name: Habilitar Virtualization Based Security
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard
    name: EnableVirtualizationBasedSecurity
    data: 1
    type: dword
  when: ams_enable_credential_guard | bool

- name: Habilitar Credential Guard LSA
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: LsaCfgFlags
    data: 1
    type: dword
  when: ams_enable_credential_guard | bool

- name: Ajustar tamanho do Security Log
  ansible.windows.win_powershell:
    script: |
      wevtutil sl Security /ms:{{ ams_security_log_size_kb * 1024 }}

- name: Ajustar tamanho do System Log
  ansible.windows.win_powershell:
    script: |
      wevtutil sl System /ms:{{ ams_system_log_size_kb * 1024 }}

- name: Ajustar tamanho do Application Log
  ansible.windows.win_powershell:
    script: |
      wevtutil sl Application /ms:{{ ams_application_log_size_kb * 1024 }}

- name: Habilitar Windows Event Collector para WEF
  ansible.windows.win_service:
    name: Wecsvc
    start_mode: auto
    state: started
  when: ams_validate_wef | bool
