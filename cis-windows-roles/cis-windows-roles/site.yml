---
- name: AMS CIS L1 Core - Windows Server Modular
  hosts: all
  gather_facts: false

  collections:
    - ansible.windows
    - community.windows

  roles:
    - role: cis_detect_context
      tags: [always, detect_context]

    - role: cis_evidence
      tags: [always, evidence, backup]

    - role: cis_password_lockout
      tags: [password_policy, account_lockout, cis_l1]

    - role: cis_audit_policy
      tags: [audit_policy, cis_l1]

    - role: cis_firewall_defender
      tags: [firewall, defender, asr, cis_l1]

    - role: cis_powershell_logging
      tags: [powershell_logging, cis_l1]

    - role: cis_network_hardening
      tags: [ntlm, llmnr, netbios, smb, ldap, tls, cis_l1]

    - role: cis_system_hardening
      tags: [guest, remote_registry, autorun, uac, credential_guard, eventlog, cis_l1]

    - role: cis_remote_access
      tags: [rdp, winrm, cis_l1]

    - role: cis_compliance_validation
      tags: [validation, compliance, evidence]

  post_tasks:
    - name: Resumo CIS modular
      ansible.builtin.debug:
        msg:
          - "Servidor: {{ inventory_hostname }}"
          - "Domain Member: {{ is_domain_member | default('unknown') }}"
          - "Password Policy aplicada: {{ not is_domain_member | default(false) }}"
          - "Lockout Policy aplicada: {{ not is_domain_member | default(false) }}"
          - "Controles de auditoria, firewall, Defender, PowerShell Logging, NTLM, LLMNR, NetBIOS, SMB, LDAP, TLS, RDP, WinRM e validações processados."
          - "Evidências em: {{ ams_evidence_path }}"
          - "Backup em: {{ ams_backup_path }}"
